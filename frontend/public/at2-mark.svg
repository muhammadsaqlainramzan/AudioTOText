    </linearGradient>

    <filter id="softGlow" x="11" y="15" width="84" height="110" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>

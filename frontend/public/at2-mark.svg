    />
    <path
      d="M94.8 40H119.5V51H112.6V89H101.7V51H94.8V40Z"
      fill="white"
    />
    <path
      d="M88 89C94.9 82.4 101.9 75.7 109.1 68.9C114.3 64 116.2 60.7 116.2 56C116.2 48.8 110.8 43.8 103 43.8C96.2 43.8 91.4 47.2 88.5 52.8"

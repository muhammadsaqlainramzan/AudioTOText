      stroke-linejoin="round"
    />
    <path d="M88 89H118.2" stroke="#13B7FF" stroke-width="8" stroke-linecap="round"/>
  </g>

  <defs>
    <radialGradient id="bgGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(74 86) rotate(137) scale(82 67)">
      <stop stop-color="#063B8C" stop-opacity=".34"/>
      <stop offset=".55" stop-color="#0B1227" stop-opacity=".1"/>
      <stop offset="1" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="arcGradient" x1="24" y1="27" x2="95" y2="111" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91D8FF"/>
      <stop offset=".38" stop-color="#12B8FF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="waveGradient" x1="10" y1="33" x2="82" y2="101" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9BE7FF"/>
      <stop offset=".45" stop-color="#13B7FF"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="aGradient" x1="47" y1="39" x2="93" y2="91" gradientUnits="userSpaceOnUse">
      <stop stop-color="#28C6FF"/>
      <stop offset=".52" stop-color="#0EA5E9"/>

    <rect x="20" y="50" width="6" height="34" rx="3" fill="url(#waveGradient)"/>
    <rect x="31" y="42" width="6" height="50" rx="3" fill="url(#waveGradient)"/>
    <rect x="42" y="33" width="7" height="68" rx="3.5" fill="url(#waveGradient)"/>
    <rect x="54" y="42" width="6" height="50" rx="3" fill="url(#waveGradient)"/>
    <rect x="65" y="51" width="6" height="32" rx="3" fill="url(#waveGradient)"/>
    <rect x="76" y="59" width="5" height="16" rx="2.5" fill="url(#waveGradient)"/>
  </g>

  <g filter="url(#letterGlow)">
    <path
